<!-- BryntumDemoHeader component is used for Bryntum example styling only and can be removed -->
<bryntum-demo-header></bryntum-demo-header>
<div class = "demo-app">
    <div class = "demo-toolbar align-right">
        <bryntum-button
            cls = "b-skip-test"
            text = "Export"
            (onClick) = "onExportClick()"
        ></bryntum-button>
    </div>

    <bryntum-scheduler
        #scheduler
        [barMargin] = "schedulerProps.barMargin"
        [columns] = "schedulerProps.columns"
        [crudManager] = "schedulerProps.crudManager"
        [dependenciesFeature] = "schedulerProps.dependenciesFeature"
        [endDate] = "schedulerProps.endDate"
        [eventColor] = "schedulerProps.eventColor"
        [eventDragFeature] = "schedulerProps.eventDragFeature"
        [eventRenderer] = "schedulerProps.eventRenderer"
        [eventStyle] = "schedulerProps.eventStyle"
        [pdfExportFeature] = "schedulerProps.pdfExportFeature"
        [rowHeight] = "schedulerProps.rowHeight"
        [smoothZoom] = "schedulerProps.smoothZoom"
        [startDate] = "schedulerProps.startDate"
        [stripeFeature] = "schedulerProps.stripeFeature"
        [timeRangesFeature] = "schedulerProps.timeRangesFeature"
        [viewPreset] = "schedulerProps.viewPreset"
    ></bryntum-scheduler>
</div>
