<!DOCTYPE html>
<html lang="en">

<head>
	<meta name="description" content="Resources and events are lazily loaded on demand via Redux Toolkit Query, so the scheduler scrolls smoothly through large datasets on both axes."/>
	<meta charset="UTF-8">
	<title>Bryntum Scheduler - Lazy loading with RTK Query (React + Vite)</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" href="favicon.png">
	<link rel="stylesheet" data-bryntum-theme />
</head>

<body>
	<div id="root"></div>
	<script>
		// This script is for internal Bryntum examples browser functionality. Should be removed
		if (window.location.pathname.includes('/examples-scheduler/') && !/examples-scheduler\/.*\/dist/.test(window.location.pathname)) {
			window.location.href = 'dist/' + window.location.search;
		}
		else {
			document.querySelector('link[data-bryntum-theme=""]').href = "themes/svalbard-light.css";
		}
	</script>
	<script type="module" src="src/main.tsx"></script>
</body>

</html>
