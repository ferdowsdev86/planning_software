<!DOCTYPE html>
<html lang="en">

<head>
	<meta name="description" content="This example shows how to use the Custom elements version of the Scheduler"/>
	<meta charset="UTF-8">
	<title>Bryntum Scheduler - Web Components demo</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<!-- These stylesheets are not needed for the actual webcomponent to work, it includes its own style -->
	<link rel="stylesheet" href="../../resources/fontawesome/css/fontawesome.css">
	<link rel="stylesheet" href="../../resources/fontawesome/css/solid.css">
	<link rel="stylesheet" href="../../build/schedulerpro.css">
	<link rel="stylesheet" href="../../build/svalbard-light.css" data-bryntum-theme>
	<link rel="stylesheet" href="../_shared/shared.css">
	<link rel="stylesheet" href="resources/app.css">
</head>

<body>
	<div id="container">
		<bryntum-scheduler
				class="demo-app"
				theme="../../build/svalbard-light.css"
				stylesheet="../../build/schedulerpro.css"
				fa-path="../../build/fontawesome/webfonts"
				data-min-height="20em"
				data-view-preset="weekAndDay"
				data-start-date="2018-04-02"
				data-end-date="2018-04-09"
		>
			<column data-field="name" data-width="120">Name</column>
			<data>
				<events>
					<data data-id="1" data-name="Click me" data-icon-cls="fa fa-mouse-pointer" data-resource-id="1" data-start-date="2018-04-03" data-end-date="2018-04-05"></data>
					<data data-id="2" data-name="Drag me" data-icon-cls="fa fa-arrows-alt" data-resource-id="2" data-start-date="2018-04-04" data-end-date="2018-04-06"></data>
					<data data-id="3" data-name="Resize me" data-icon-cls="fa fa-arrows-alt-h" data-resource-id="3" data-start-date="2018-04-05" data-end-date="2018-04-07"></data>
				</events>
				<resources>
					<data data-id="1" data-name="Daniel"></data>
					<data data-id="2" data-name="Steven"></data>
					<data data-id="3" data-name="Sergei"></data>
				</resources>
			</data>
		</bryntum-scheduler>
	</div>
	<script src="../_shared/locales/examples.locales.umd.js"></script>
	<script data-default-locale="En" type="module" src="app.module.js"></script>
</body>

</html>
