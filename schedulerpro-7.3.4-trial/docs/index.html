<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bryntum Scheduler Pro - Docs browser</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="Documentation for the Bryntum Scheduler Pro JavaScript component." name="Description">
    <link href="resources/images/favicon.png" rel="shortcut icon" />
    <link href="resources/fontawesome/css/fontawesome.css" rel="stylesheet">
    <link href="resources/fontawesome/css/solid.css" rel="stylesheet">
    <link href="resources/fontawesome/css/brands.css" rel="stylesheet">
    <link href="resources/core.thin.css" rel="stylesheet">
    <link href="resources/chart.thin.css" rel="stylesheet">
    <link href="resources/grid.thin.css" rel="stylesheet">
    <link href="resources/scheduler.thin.css" rel="stylesheet">
    <link href="resources/schedulerpro.thin.css" rel="stylesheet">
    <script>
        const
            useDarkTheme = window.darkDocs = localStorage.getItem('bryntum-docs-dark') === 'true' || localStorage.getItem('bryntum-docs-dark') === null && window.matchMedia('(prefers-color-scheme: dark)').matches,
            theme = document.createElement('link'),
            style = document.createElement('style');

        theme.rel = 'stylesheet';
        theme.href = `resources/svalbard-${useDarkTheme ? 'dark' : 'light'}.css`;
        theme.setAttribute('data-bryntum-theme', '');
        document.head.appendChild(theme);

        style.innerHTML = `body { color-scheme : ${useDarkTheme ? 'dark' : 'light'}; }`;
        document.head.appendChild(style);
    </script>
    <link href="resources/build/docs.min.css" rel="stylesheet">
</head>

<body id="app" class="b-bryntum">
    <script>document.body.classList.toggle('dark-docs', Boolean(window.darkDocs));</script>
    <header class="docs-header">
        <button id="toggle-tree"><i class="fa fa-bars"></i></button>
        <a href="https://bryntum.com" id="home-link" aria-label="Bryntum home page">
            <svg viewBox="0 0 354.9 144.52" xmlns="http://www.w3.org/2000/svg">
                <g><path d="m305.63 144.52c-12.47 0-23.53-4.83-31.58-13.28v11.06h-25.54v-142.3h26.75v48.58c7.84-7.64 18.5-12.07 30.37-12.07 27.15 0 49.28 23.33 49.28 54.1s-22.12 53.9-49.28 53.9zm-3.82-83.47c-14.68 0-26.55 13.27-26.55 29.77s11.87 29.16 26.55 29.16 26.55-12.67 26.55-29.16-11.87-29.77-26.55-29.77z"/><path d="m148.02 0h74.01v29.78h-74.01z"/><path d="m0 56.26h222.03v29.78h-222.03z"/><path d="m74.01 112.52h148.02v29.6h-148.02z"/></g>
            </svg>
        </a>
        <a href="#" id="title">
            <button id="product-selector">Bryntum Scheduler Pro</button>
            <span id="versionId"></span>
        </a>
        <div id="search"></div>
        <div id="tools"></div>
    </header>
    <div id="container">
        <div id="tree"></div>
        <div id="content"></div>
    </div>
    <script src="lib/algolia.umd.js"></script>
    <script src="lib/showdown.min.js" type="text/javascript"></script>
    <script src="lib/highlight.min.js" type="text/javascript"></script>
    <script id="entry" src="lib/app.js" type="module"></script>
</body>
</html>
